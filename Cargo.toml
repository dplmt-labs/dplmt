[workspace]
resolver = "2"
members = ["crates/router"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
authors = ["DPLMT Labs <dev@dplmt.fun>"]
repository = "https://github.com/dplmt-labs/dplmt"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = "2"
tracing = "0.1"
async-trait = "0.1"
